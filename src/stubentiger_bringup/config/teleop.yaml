# teleop_twist_joy: split arcade on the SDL game-controller layout (#24, "Teleop chain").
# Nothing drives without a held button: LB is the Dead-man button, RB is Turbo and drives on its
# own too. On release it publishes one zero twist, then stays silent.
# B (e-stop) and Back + Start (shutdown) stay unmapped and reserved.
teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true
    frame: base_footprint
    require_enable_button: true
    enable_button: 9 # LB
    enable_turbo_button: 10 # RB
    axis_linear:
      x: 1 # left stick Y
    axis_angular:
      yaw: 2 # right stick X
    inverted_reverse: false
    # Normal
    scale_linear:
      x: 0.3
    scale_angular:
      yaw: 1.2
    # Turbo
    scale_linear_turbo:
      x: 0.6
    scale_angular_turbo:
      yaw: 2.5
